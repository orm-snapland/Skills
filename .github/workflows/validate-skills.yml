name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling dependencies
        run: python -m pip install -r tooling/requirements.txt

      - name: Validate skills and the template
        run: python tooling/validate_skills.py

      - name: Test the validator and packager
        run: python -m unittest discover -s tests -v
